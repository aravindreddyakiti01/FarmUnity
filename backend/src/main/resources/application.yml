spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:farmunity;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:farmunity-jwt-secret-key-for-hackathon-2024-sih-ps33}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  commission-rate: ${APP_COMMISSION_RATE:0.02}
  yield-shortfall-threshold: ${APP_YIELD_SHORTFALL_THRESHOLD:0.05}
  rate-limit:
    NEW: 2
    VERIFIED: 10
    ESTABLISHED: 50
    TRUSTED: 200

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info
